name: Android 1.0.0 device verification
on:
  push:
    branches: [verify/energy-kits-android-1.0.0]
permissions:
  contents: read
  actions: read
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '45674698337'
          name: EnergyKits-1.0.0-debug
          path: app/build/outputs/apk/debug
      - name: Check the exact APK bytes
        run: echo '6768f813290be3816b0ac7357425a5d791885e15c41a09ff4530769517cd2352  app/build/outputs/apk/debug/app-debug.apk' | sha256sum -c -
      - name: Prepare Android SDK and emulator
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod a+rw /dev/kvm
          SDKTOOLS="$ANDROID_HOME/cmdline-tools/latest/bin"
          set +o pipefail
          yes | "$SDKTOOLS/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$SDKTOOLS/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "emulator" "platform-tools" "system-images;android-35;google_apis;x86_64"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/energy-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | "$SDKTOOLS/avdmanager" create avd --name EnergyKitsVerification --package "system-images;android-35;google_apis;x86_64" --device pixel_2 --path "$ANDROID_AVD_HOME/EnergyKitsVerification.avd"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx EnergyKitsVerification
          "$ANDROID_HOME/emulator/emulator" -avd EnergyKitsVerification -no-window -no-audio -no-snapshot -no-boot-anim -no-metrics -gpu swiftshader_indirect > "$RUNNER_TEMP/energy-emulator.log" 2>&1 &
          emulator_pid=$!
          if ! kill -0 "$emulator_pid"; then
            cat "$RUNNER_TEMP/energy-emulator.log"
            exit 1
          fi
          timeout 180 adb wait-for-device
          for attempt in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/energy-emulator.log"
          exit 1
      - name: Exercise selection, comparison, saving and PDF
        run: python3 .github/verification/energy-kit-device.py
      - name: Collect runtime evidence
        if: always()
        run: |
          mkdir -p device-evidence
          cp "$RUNNER_TEMP/energy-emulator.log" device-evidence/ || true
          timeout 12 adb logcat -d -t 600 > device-evidence/logcat.txt || true
          timeout 12 adb exec-out screencap -p > device-evidence/screen.png || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-evidence
          path: device-evidence/
